server:
  port: 8084
spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/multivendor_order?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:sesi8768}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  jackson:
    deserialization:
      fail-on-unknown-properties: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
management:
  endpoints:
    web:
      exposure:
        include: health,info
security:
  jwt:
    secret: ${JWT_SECRET:multivendor-local-jwt-secret-key-2026-secure}
    issuer: multivendor-auth
    expiration-seconds: 14400
  internal-key: ${INTERNAL_API_KEY:multivendor-internal-service-key-2026}
