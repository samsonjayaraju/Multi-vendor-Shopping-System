spring:
  datasource:
    url: jdbc:h2:mem:order_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
eureka:
  client:
    enabled: false
security:
  jwt:
    secret: multivendor-local-jwt-secret-key-2026-secure
    issuer: multivendor-auth
    expiration-seconds: 14400
  internal-key: multivendor-internal-service-key-2026
